#======== IMV / Affine AMVR study - Scenario E1 (IMV disabled) ========
# See docs/research-protocol.md section 7.2 / 15.2
# Isolates IMV impact via E0 x E1
# IMV=0, AffineAmvr=1, AffineAmvrEncOpt=1
#
# WARNING: this combination is REJECTED by EncAppCfg.cpp ("AffineAmvr cannot be
# used when IMV is disabled") because VVC only allows sps_affine_amvr_enabled_flag=1
# when sps_amvr_enabled_flag (IMV) is also enabled. This is not a build limitation,
# it is a standard-conformance constraint -- no valid VVC bitstream can express IMV
# off + Affine AMVR on. Encoding with this cfg will abort with an error. Kept as-is
# to match the (currently unrevised) experimental matrix -- see the warning in
# docs/research-protocol.md section 7.2 before using this file.
IMV                           : 0
AffineAmvr                    : 1
AffineAmvrEncOpt              : 1
